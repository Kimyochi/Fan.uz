<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan.uz | Ilm-fan platformasi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #0a0f2a, #0a1a3a); color: white; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 30px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 24px; font-weight: bold; color: #ffd700; }
        .nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .nav a { color: #ffd700; cursor: pointer; padding: 8px 16px; background: rgba(0,0,0,0.3); border-radius: 30px; text-decoration: none; }
        .btn { background: #ffd700; color: #000; padding: 10px 25px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .card { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .fan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .fan-card { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 15px; cursor: pointer; border-left: 4px solid #ffd700; transition: 0.3s; }
        .fan-card:hover { transform: translateY(-5px); background: rgba(255,215,0,0.15); }
        .fan-name { font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; }
        .submenu { display: none; margin-top: 15px; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
        .submenu.open { display: grid; }
        .sub-item { background: rgba(0,0,0,0.5); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; }
        .sub-item:hover { background: rgba(255,215,0,0.3); }
        .progress-bar { width: 100%; background: #333; border-radius: 20px; height: 15px; overflow: hidden; margin: 10px 0; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffd700, #ff8800); border-radius: 20px; transition: width 0.5s; }
        .auth-card { background: rgba(0,0,0,0.6); border-radius: 20px; padding: 40px; max-width: 400px; margin: 100px auto; text-align: center; border: 1px solid #ffd700; }
        .auth-card input { width: 100%; padding: 14px; margin: 12px 0; border-radius: 30px; border: none; background: rgba(255,255,255,0.1); color: white; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tabs button { flex: 1; padding: 12px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 30px; cursor: pointer; }
        .auth-tabs button.active { background: #ffd700; color: #000; }
        .error { color: #ff8888; margin-top: 10px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #28a745; padding: 12px 24px; border-radius: 40px; animation: fadeOut 3s forwards; z-index: 1000; }
        @keyframes fadeOut { 0% { opacity:1; } 70% { opacity:1; } 100% { opacity:0; visibility:hidden; } }
        @media (max-width: 768px) { .header { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    const SUPER_LOGIN = "Kimyochi_9222";
    const SUPER_PASS = "+507Asal!?";
    
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('fan_users')) || [];
    let timeSpent = JSON.parse(localStorage.getItem('fan_time')) || {};
    let timer = null;
    
    const fanlar = [
        { nom: "📐 Matematika", bolimlar: ["Algebra", "Geometriya", "Trigonometriya", "Analiz", "Statistika", "Diskret", "Tarix"] },
        { nom: "⚡ Fizika", bolimlar: ["Mexanika", "Optika", "Elektrodinamika", "Termodinamika", "Kvant", "Yadro", "Astrofizika"] },
        { nom: "⚗️ Kimyo", bolimlar: ["Organik", "Anorganik", "Analitik", "Fizik", "Biokimyo", "Polimer", "Ekologik"] },
        { nom: "🧬 Biologiya", bolimlar: ["Botanika", "Zoologiya", "Anatomiya", "Genetika", "Ekologiya", "Mikrobiologiya", "Biotexnologiya"] },
        { nom: "💻 Informatika", bolimlar: ["Dasturlash", "Algoritmlar", "Ma'lumotlar", "Tarmoqlar", "AI", "Xavfsizlik", "Web"] },
        { nom: "🌙 Astronomiya", bolimlar: ["Quyosh", "Sayyoralar", "Yulduzlar", "Galaktikalar", "Kosmologiya", "Teleskoplar", "Tarix"] },
        { nom: "🌍 Geografiya", bolimlar: ["Fizik", "Iqtisodiy", "Siyosiy", "Kartografiya", "Geologiya", "Meteorologiya", "Ekologiya"] },
        { nom: "📜 Tarix", bolimlar: ["Qadimgi", "O'rta asr", "Yangi", "O'zbekiston", "Jahon", "Arxeologiya", "Madaniyat"] },
        { nom: "📊 Iqtisod", bolimlar: ["Mikro", "Makro", "Xalqaro", "Moliyaviy", "Mehnat", "Rivojlanish", "Tadbirkorlik"] },
        { nom: "⚖️ Huquq", bolimlar: ["Konstitutsiya", "Fuqarolik", "Jinoyat", "Mehnat", "Xalqaro", "Solik", "Sud"] }
    ];
    
    for (let i = 10; i < 25; i++) {
        fanlar.push({ nom: "Fan " + (i+1), bolimlar: ["Bo'lim 1", "Bo'lim 2", "Bo'lim 3", "Bo'lim 4", "Bo'lim 5", "Bo'lim 6", "Bo'lim 7"] });
    }
    
    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function updateProgress() {
        if (!currentUser) return;
        let data = timeSpent[currentUser.login] || { minutes: 0 };
        let percent = Math.min(100, (data.minutes / 180) * 100);
        let bar = document.getElementById('progressFill');
        if (bar) bar.style.width = percent + '%';
        let span = document.getElementById('timeDisplay');
        if (span) span.innerHTML = `⏱️ Bugun: ${data.minutes} / 180 daqiqa`;
        if (data.minutes >= 180 && !data.rewardGiven) {
            data.balance = (data.balance || 0) + 5000;
            data.rewardGiven = true;
            timeSpent[currentUser.login] = data;
            localStorage.setItem('fan_time', JSON.stringify(timeSpent));
            showToast("🎉 3 soat to'ldi! +5000 so'm!");
        }
    }
    
    function startTimer() {
        if (!currentUser) return;
        let data = timeSpent[currentUser.login] || { minutes: 0, lastDate: new Date().toDateString(), balance: 0, rewardGiven: false };
        let today = new Date().toDateString();
        if (data.lastDate !== today) {
            data.minutes = 0;
            data.rewardGiven = false;
            data.lastDate = today;
        }
        timeSpent[currentUser.login] = data;
        localStorage.setItem('fan_time', JSON.stringify(timeSpent));
        if (timer) clearInterval(timer);
        let lastActive = Date.now();
        timer = setInterval(() => {
            if (currentUser && document.hasFocus()) {
                let now = Date.now();
                let diff = Math.floor((now - lastActive) / 60000);
                if (diff >= 1) {
                    let cd = timeSpent[currentUser.login] || { minutes: 0 };
                    cd.minutes = (cd.minutes || 0) + Math.min(diff, 5);
                    timeSpent[currentUser.login] = cd;
                    localStorage.setItem('fan_time', JSON.stringify(timeSpent));
                    updateProgress();
                    lastActive = now;
                }
            } else { lastActive = Date.now(); }
        }, 60000);
        updateProgress();
    }
    
    function renderHome() {
        let html = `<div class="card"><h2>📚 Fanlar dunyosi</h2><div class="fan-grid" id="fanGrid"></div></div>`;
        document.getElementById('pageContent').innerHTML = html;
        let grid = document.getElementById('fanGrid');
        for (let i = 0; i < fanlar.length; i++) {
            let fan = fanlar[i];
            let div = document.createElement('div');
            div.className = 'fan-card';
            div.innerHTML = `<div class="fan-name">${fan.nom} <span>▼</span></div><div class="submenu" id="sub-${i}"></div>`;
            div.onclick = (function(idx) { return function(e) { e.stopPropagation(); document.getElementById('sub-'+idx).classList.toggle('open'); }; })(i);
            let sub = div.querySelector('.submenu');
            for (let j = 0; j < fan.bolimlar.length; j++) {
                let b = fan.bolimlar[j];
                let item = document.createElement('div');
                item.className = 'sub-item';
                item.innerHTML = `<strong>${b}</strong><br><small>📖 Dars</small>`;
                item.onclick = (function(fn, bn) { return function(e) { e.stopPropagation(); alert(`📘 ${fn} / ${bn}\n\nBu bo'limda dars matni va video havola bo'ladi.`); }; })(fan.nom, b);
                sub.appendChild(item);
            }
            grid.appendChild(div);
        }
    }
    
    function renderNews() { document.getElementById('pageContent').innerHTML = `<div class="card"><h2>📰 Yangiliklar</h2><div style="background:rgba(0,0,0,0.3); padding:20px; border-radius:20px;"><h3>📢 25 ta fan qo'shildi!</h3><p>Endi saytimizda 25 ta fan mavjud.</p></div></div>`; }
    function renderQuiz() { document.getElementById('pageContent').innerHTML = `<div class="card"><h2>📝 Viktorinalar</h2><div style="text-align:center; padding:40px;"><p>Tez kunda!</p><button class="btn" onclick="showToast('Tez orada')">Test</button></div></div>`; }
    function renderOlympiad() { document.getElementById('pageContent').innerHTML = `<div class="card"><h2>🏆 Olimpiadalar</h2><div style="background:rgba(0,0,0,0.3); padding:20px;"><h3>🏅 Matematika Olimpiadasi</h3><p>Sana: 15-may 2025 | 1.000.000 so'm</p><button class="btn" onclick="alert('Admin bilan bog\'laning')">Ro'yxat</button></div></div>`; }
    function renderStats() { let d = timeSpent[currentUser.login] || { minutes:0, balance:0 }; document.getElementById('pageContent').innerHTML = `<div class="card"><h2>📊 Statistika</h2><p>📅 Bugun: ${d.minutes}/180 daqiqa</p><p>💰 Balans: ${d.balance || 0} so'm</p><button class="btn" onclick="alert('22-sanada')">💸 Pul yechish</button></div>`; }
    function renderPartners() { let code = currentUser.login + "_" + Math.random().toString(36).substr(2,5).toUpperCase(); document.getElementById('pageContent').innerHTML = `<div class="card"><h2>🤝 Hamkorlik</h2><code style="display:block; background:#333; padding:15px; border-radius:15px;">${code}</code><button class="btn" onclick="navigator.clipboard.writeText('${code}')">📋 Nusxalash</button><p>Har bir taklif uchun 50 000 so'm!</p></div>`; }
    function renderAdmin() { if(currentUser.role !== 'superadmin'){ document.getElementById('pageContent').innerHTML = `<div class="card"><p>🔒 Faqat Super admin!</p></div>`; return; } document.getElementById('pageContent').innerHTML = `<div class="card"><h2>⚙️ Admin panel</h2><p>👥 Foydalanuvchilar: ${users.length}</p><button class="btn" onclick="localStorage.clear(); location.reload()" style="background:#aa2222;">⚠️ Tozalash</button></div>`; }
    
    function showProfile() {
        let img = localStorage.getItem('user_img_' + currentUser.login) || '';
        let html = `<div class="card"><h2>👤 Profil</h2><div style="text-align:center;"><img src="${img || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png'}" style="width:100px; height:100px; border-radius:50%;"><br><input type="file" id="profileImg" accept="image/*"><button class="btn" onclick="uploadImg()">📸 Yuklash</button></div><input type="password" id="newPass" placeholder="Yangi parol"><button class="btn" onclick="changePass()">Parolni o'zgartirish</button></div>`;
        document.getElementById('pageContent').innerHTML = html;
    }
    
    window.uploadImg = function() {
        let file = document.getElementById('profileImg').files[0];
        if (file && file.size <= 2*1024*1024) {
            let reader = new FileReader();
            reader.onload = e => { localStorage.setItem('user_img_' + currentUser.login, e.target.result); showToast("✅ Rasm yangilandi!"); showProfile(); };
            reader.readAsDataURL(file);
        } else showToast("❌ 2MB dan kichik rasm tanlang!");
    };
    
    window.changePass = function() {
        let newPass = document.getElementById('newPass').value;
        if (newPass) {
            if (currentUser.role === 'superadmin') { alert("Super admin parolini o'zgartirish mumkin emas!"); return; }
            let user = users.find(u => u.login === currentUser.login);
            if (user) user.password = newPass;
            localStorage.setItem('fan_users', JSON.stringify(users));
            showToast("✅ Parol yangilandi!");
        }
    };
    
    function showPage(p) {
        if (p === 'home') renderHome(); else if (p === 'news') renderNews(); else if (p === 'quiz') renderQuiz();
        else if (p === 'olympiad') renderOlympiad(); else if (p === 'stats') renderStats();
        else if (p === 'partners') renderPartners(); else if (p === 'admin') renderAdmin();
        else if (p === 'profile') showProfile();
    }
    
    function showMain() {
        let role = currentUser.role === 'superadmin' ? '👑 Super Admin' : '👤 Foydalanuvchi';
        let img = localStorage.getItem('user_img_' + currentUser.login) || '';
        let adminLink = currentUser.role === 'superadmin' ? '<a onclick="showPage(\'admin\')">⚙️ Admin</a>' : '';
        let html = `
            <div class="header">
                <div class="logo">📘 Fan.uz</div>
                <div class="user-badge"><img src="${img || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png'}" style="width:30px; height:30px; border-radius:50%;"> ${role}: ${currentUser.login}</div>
            </div>
            <div class="nav">
                <a onclick="showPage('home')">🏠 Bosh</a> <a onclick="showPage('news')">📰 Yangiliklar</a>
                <a onclick="showPage('quiz')">📝 Viktorinalar</a> <a onclick="showPage('olympiad')">🏆 Olimpiadalar</a>
                <a onclick="showPage('stats')">📊 Statistika</a> <a onclick="showPage('partners')">🤝 Hamkorlik</a>
                <a onclick="showPage('profile')">👤 Profil</a> ${adminLink} <a onclick="logout()">🚪 Chiqish</a>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div style="text-align:center; margin-bottom:15px;" id="timeDisplay">⏱️ Bugun: 0 / 180 daqiqa</div>
            <div id="pageContent"></div>
        `;
        document.getElementById('app').innerHTML = html;
        startTimer();
        renderHome();
    }
    
    function showAuth() {
        document.getElementById('app').innerHTML = `
            <div class="auth-card">
                <h1>📘 Fan.uz</h1>
                <div class="auth-tabs"><button id="tabLogin" class="active" onclick="toggleAuth('login')">Kirish</button><button id="tabReg" onclick="toggleAuth('register')">Ro'yxatdan o'tish</button></div>
                <div id="authForm"></div>
            </div>
        `;
        toggleAuth('login');
    }
    
    window.toggleAuth = function(type) {
        let container = document.getElementById('authForm');
        document.getElementById('tabLogin').classList.toggle('active', type==='login');
        document.getElementById('tabReg').classList.toggle('active', type==='register');
        if (type === 'login') {
            container.innerHTML = `<input type="text" id="loginName" placeholder="Login"><input type="password" id="loginPass" placeholder="Parol"><button class="btn" onclick="doLogin()">Kirish</button><div id="authError" class="error"></div>`;
        } else {
            container.innerHTML = `<input type="text" id="regName" placeholder="Ism"><input type="text" id="regSurname" placeholder="Familiya"><input type="email" id="regEmail" placeholder="Email"><input type="text" id="regLogin" placeholder="Login"><input type="password" id="regPass" placeholder="Parol"><select id="regType"><option value="student">O'quvchi</option><option value="teacher">O'qituvchi</option></select><button class="btn" onclick="doRegister()">Ro'yxatdan o'tish</button><div id="authError" class="error"></div>`;
        }
    };
    
    window.doLogin = function() {
        let login = document.getElementById('loginName').value;
        let pass = document.getElementById('loginPass').value;
        let err = document.getElementById('authError');
        if (login === SUPER_LOGIN && pass === SUPER_PASS) { currentUser = { login: SUPER_LOGIN, role: 'superadmin' }; showMain(); return; }
        let user = users.find(u => u.login === login && u.password === pass);
        if (user) { currentUser = { login: user.login, role: 'user' }; showMain(); return; }
        err.innerHTML = "❌ Login yoki parol xato!";
    };
    
    window.doRegister = function() {
        let login = document.getElementById('regLogin').value;
        let pass = document.getElementById('regPass').value;
        let name = document.getElementById('regName').value;
        let surname = document.getElementById('regSurname').value;
        let email = document.getElementById('regEmail').value;
        let type = document.getElementById('regType').value;
        let err = document.getElementById('authError');
        if (!login || !pass || !name || !surname || !email) { err.innerHTML = "❌ Barcha maydonlarni to'ldiring!"; return; }
        if (users.find(u => u.login === login)) { err.innerHTML = "❌ Bu login band!"; return; }
        if (login === SUPER_LOGIN) { err.innerHTML = "❌ Bu login band!"; return; }
        let promo = login + "_" + Math.random().toString(36).substr(2,5).toUpperCase();
        users.push({ login, password: pass, name, surname, email, type, promoCode: promo });
        localStorage.setItem('fan_users', JSON.stringify(users));
        timeSpent[login] = { minutes:0, balance:0 };
        localStorage.setItem('fan_time', JSON.stringify(timeSpent));
        err.innerHTML = "✅ Ro'yxatdan o'tdingiz! Endi kiring.";
        err.style.color = "#88ff88";
        setTimeout(() => toggleAuth('login'), 2000);
    };
    
    window.logout = function() { currentUser = null; if(timer) clearInterval(timer); showAuth(); };
    
    showAuth();
</script>
</body>
</html>
