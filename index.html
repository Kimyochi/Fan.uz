<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fan.uz | Mukammal ilm-fan platformasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a0f2a, #0a1a3a); color: #eef; min-height: 100vh; transition: all 0.3s ease; }
        body.light { background: linear-gradient(135deg, #f5f5f5, #e8e8e8); color: #1a1a2e; }
        body.light .card, body.light .auth-card, body.light .fan-card, body.light .sub-item { background: rgba(0,0,0,0.06); backdrop-filter: none; }
        body.light .navbar { background: rgba(200,200,200,0.9); }
        body.light .nav-links a { color: #1a1a2e; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .navbar { background: rgba(10,20,40,0.95); backdrop-filter: blur(12px); border-radius: 60px; padding: 12px 25px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border: 1px solid rgba(255,215,0,0.3); }
        .logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #ffd700, #ffaa00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .nav-links a { color: #eef; text-decoration: none; padding: 8px 18px; border-radius: 40px; transition: 0.3s; cursor: pointer; font-size: 14px; font-weight: 500; }
        .nav-links a:hover { background: rgba(255,215,0,0.2); color: #ffd700; transform: translateY(-2px); }
        .user-badge { background: #ffd700; color: #0a0f2a; padding: 8px 20px; border-radius: 50px; font-weight: bold; display: flex; align-items: center; gap: 12px; }
        .user-badge img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .btn { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #0a0f2a; padding: 8px 20px; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.3s; margin: 5px; font-size: 13px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.4); }
        .btn-red { background: linear-gradient(135deg, #aa2222, #cc3333); color: white; }
        .btn-sm { padding: 5px 12px; font-size: 11px; }
        .card { background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); border-radius: 30px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(255,215,0,0.2); }
        
        .auth-card { background: rgba(0,0,0,0.7); border-radius: 40px; padding: 45px; max-width: 520px; margin: 100px auto; border: 1px solid #ffd700; text-align: center; backdrop-filter: blur(15px); }
        .auth-card h1 { color: #ffd700; margin-bottom: 30px; font-size: 42px; }
        .auth-card input, .auth-card select { width: 100%; padding: 15px 20px; margin: 12px 0; border-radius: 60px; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 15px; }
        .auth-tabs { display: flex; gap: 15px; margin-bottom: 30px; }
        .auth-tabs button { flex: 1; padding: 14px; background: rgba(255,255,255,0.15); color: white; border: none; border-radius: 60px; cursor: pointer; font-size: 16px; }
        .auth-tabs button.active { background: #ffd700; color: #000; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .error { color: #ff8888; margin-top: 15px; }
        
        .fan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .fan-card { background: rgba(0,0,0,0.5); border-radius: 28px; padding: 20px; cursor: pointer; transition: all 0.35s; border-left: 6px solid #ffd700; }
        .fan-card:hover { transform: translateY(-8px); background: rgba(255,215,0,0.12); }
        .fan-name { font-size: 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .fan-edit { font-size: 14px; background: rgba(255,215,0,0.2); padding: 5px 12px; border-radius: 30px; cursor: pointer; }
        .fan-edit:hover { background: #ffd700; color: #000; }
        .submenu { display: none; margin-top: 20px; grid-template-columns: 1fr; animation: fadeInUp 0.4s; }
        .submenu.open { display: block; }
        @keyframes fadeInUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        .sub-item { background: rgba(0,0,0,0.6); border-radius: 22px; padding: 16px; margin-bottom: 15px; cursor: pointer; transition: 0.25s; border: 1px solid rgba(255,215,0,0.2); }
        .sub-item:hover { transform: scale(1.01); background: rgba(255,215,0,0.15); }
        .sub-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .sub-item-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .edit-bolim { font-size: 12px; background: rgba(255,215,0,0.3); padding: 3px 10px; border-radius: 20px; cursor: pointer; }
        .books-list { margin-top: 15px; border-top: 1px solid rgba(255,215,0,0.2); padding-top: 10px; }
        .book-card { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 12px; margin-bottom: 10px; display: flex; gap: 15px; align-items: center; }
        .book-card img { width: 60px; height: 80px; object-fit: cover; border-radius: 10px; }
        .book-info { flex: 1; }
        .book-info h4 { font-size: 14px; margin-bottom: 5px; }
        .book-info p { font-size: 11px; color: #aaa; }
        .book-actions { display: flex; gap: 8px; }
        
        .progress-bar { width: 100%; background: #333; border-radius: 30px; height: 12px; margin: 18px 0; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffd700, #ff8800); border-radius: 30px; transition: width 0.5s; }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: linear-gradient(135deg, #0a1a2f, #0a1525); max-width: 550px; width: 90%; border-radius: 40px; padding: 35px; border: 1px solid #ffd700; max-height: 85vh; overflow-y: auto; animation: modalPop 0.3s; }
        @keyframes modalPop { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
        body.light .modal-content { background: #fff; color: #1a1a2e; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 30px; border: none; background: rgba(255,255,255,0.1); color: white; }
        body.light .modal-content input { background: #f0f0f0; color: #1a1a2e; }
        
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; }
        .admin-table th, .admin-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.15); text-align: left; }
        .lang-selector { display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 50px; }
        .lang-btn { background: none; border: none; color: white; cursor: pointer; padding: 6px 14px; border-radius: 40px; font-size: 13px; }
        .lang-btn.active { background: #ffd700; color: #000; }
        .toast { position: fixed; bottom: 35px; right: 35px; background: linear-gradient(135deg, #28a745, #1e7e34); padding: 12px 24px; border-radius: 60px; animation: slideIn 0.3s, fadeOut 3s 2.7s forwards; z-index: 1100; font-weight: bold; font-size: 14px; }
        @keyframes slideIn { from { opacity:0; transform: translateX(50px); } to { opacity:1; transform: translateX(0); } }
        @keyframes fadeOut { to { opacity:0; visibility:hidden; } }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } .row-2 { grid-template-columns: 1fr; } .book-card { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    // ==================== SUPER ADMIN ====================
    const SUPER_LOGIN = "Kimyochi_9222";
    const SUPER_PASS = "+507Asal!?";
    
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('fan_users')) || [];
    let admins = JSON.parse(localStorage.getItem('fan_admins')) || [];
    let pendingTeachers = JSON.parse(localStorage.getItem('pending_teachers')) || [];
    let timeSpent = JSON.parse(localStorage.getItem('fan_time')) || {};
    let news = JSON.parse(localStorage.getItem('news')) || [
        { id: 1, title: "📢 25 ta fan qo'shildi!", content: "Endi saytimizda 25 ta fan mavjud. Har bir fan 7 ta bo'limga ega.", date: "2025-04-12" }
    ];
    let quizQuestions = JSON.parse(localStorage.getItem('quiz_questions')) || [
        { id: 1, question: "1 + 1 = ?", options: ["1", "2", "3", "4"], correct: 1, points: 100 }
    ];
    let olympiadQuestions = JSON.parse(localStorage.getItem('olympiad_questions')) || [
        { id: 1, question: "2 x 2 = ?", options: ["2", "3", "4", "5"], correct: 2, points: 200 }
    ];
    let quizResults = JSON.parse(localStorage.getItem('quiz_results')) || {};
    let olympiadResults = JSON.parse(localStorage.getItem('olympiad_results')) || {};
    let adRequests = JSON.parse(localStorage.getItem('ad_requests')) || [];
    let bookSellRequests = JSON.parse(localStorage.getItem('book_sell_requests')) || [];
    let cardInfo = JSON.parse(localStorage.getItem('card_info')) || {};
    let userImages = JSON.parse(localStorage.getItem('user_images')) || {};
    let timer = null;
    
    // 25 ta fan va 7 ta bo'lim
    let fanNames = JSON.parse(localStorage.getItem('fan_names')) || {};
    let bolimNames = JSON.parse(localStorage.getItem('bolim_names')) || {};
    let bolimBooks = JSON.parse(localStorage.getItem('bolim_books')) || {}; // { "fanIdx_bolimIdx": [ {id, name, author, year, img, pdf} ] }
    
    const defaultFans = [
        "Matematika", "Fizika", "Kimyo", "Biologiya", "Informatika",
        "Astronomiya", "Geografiya", "Tarix", "Iqtisod", "Huquq",
        "Psixologiya", "Tilshunoslik", "Adabiyot", "San'at", "Musiqa",
        "Arxitektura", "Muhandislik", "Tibbiyot", "Agronomiya", "Ekologiya",
        "Statistika", "Mantiq", "Etika", "Falsafa", "Pedagogika"
    ];
    
    const defaultBolimlar = [
        "Algebra", "Geometriya", "Trigonometriya", "Analiz", "Statistika", "Diskret", "Tarix"
    ];
    
    function getFans() {
        let fans = [];
        for (let i = 0; i < 25; i++) {
            fans.push({
                nom: fanNames[i] || defaultFans[i],
                bolimlar: []
            });
            for (let j = 0; j < 7; j++) {
                let key = i + "_" + j;
                fans[i].bolimlar.push(bolimNames[key] || defaultBolimlar[j]);
            }
        }
        return fans;
    }
    
    function saveFanNames() { localStorage.setItem('fan_names', JSON.stringify(fanNames)); }
    function saveBolimNames() { localStorage.setItem('bolim_names', JSON.stringify(bolimNames)); }
    function saveBolimBooks() { localStorage.setItem('bolim_books', JSON.stringify(bolimBooks)); }
    
    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = '<i class="fas fa-check-circle"></i> ' + msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function updateProgress() {
        if (!currentUser) return;
        let data = timeSpent[currentUser.login] || { minutes: 0 };
        let percent = Math.min(100, (data.minutes / 180) * 100);
        let bar = document.getElementById('progressFill');
        if (bar) bar.style.width = percent + '%';
        let timeSpan = document.getElementById('timeDisplay');
        if (timeSpan) timeSpan.innerHTML = `<i class="fas fa-hourglass-half"></i> Bugun: ${data.minutes} / 180 daqiqa`;
        if (data.minutes >= 180 && !data.rewardGiven) {
            data.balance = (data.balance || 0) + 5000;
            data.rewardGiven = true;
            timeSpent[currentUser.login] = data;
            localStorage.setItem('fan_time', JSON.stringify(timeSpent));
            showToast("🎉 3 soat to'ldi! +5000 so'm!");
        }
    }
    
    function startTimer() {
        if (!currentUser || currentUser.role === 'pending') return;
        let data = timeSpent[currentUser.login] || { minutes: 0, lastDate: new Date().toDateString(), balance: 0, rewardGiven: false };
        let today = new Date().toDateString();
        if (data.lastDate !== today) {
            data.minutes = 0;
            data.rewardGiven = false;
            data.lastDate = today;
        }
        timeSpent[currentUser.login] = data;
        localStorage.setItem('fan_time', JSON.stringify(timeSpent));
        if (timer) clearInterval(timer);
        let lastActive = Date.now();
        timer = setInterval(() => {
            if (currentUser && document.hasFocus()) {
                let now = Date.now();
                let diff = Math.floor((now - lastActive) / 60000);
                if (diff >= 1) {
                    let cd = timeSpent[currentUser.login] || { minutes: 0 };
                    cd.minutes = (cd.minutes || 0) + Math.min(diff, 5);
                    timeSpent[currentUser.login] = cd;
                    localStorage.setItem('fan_time', JSON.stringify(timeSpent));
                    updateProgress();
                    lastActive = now;
                }
            } else { lastActive = Date.now(); }
        }, 60000);
        updateProgress();
    }
    
    function isImageFile(url) {
        return url && (url.includes('image') || url.includes('png') || url.includes('jpg') || url.includes('jpeg') || url.includes('gif'));
    }
    
    // Kitob qo'shish modal
    function showAddBookModal(fanIdx, bolimIdx, fanNom, bolimNom) {
        let isAdmin = currentUser.role === 'superadmin' || currentUser.role === 'admin';
        if (!isAdmin) return;
        let books = bolimBooks[fanIdx + "_" + bolimIdx] || [];
        if (books.length >= 50) {
            showToast("❌ Maksimal 50 ta kitob qo'shish mumkin!");
            return;
        }
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2><i class="fas fa-book"></i> Kitob qo'shish - ${fanNom} / ${bolimNom}</h2>
                <input type="text" id="bookName" placeholder="Kitob nomi">
                <input type="text" id="bookAuthor" placeholder="Muallif">
                <input type="text" id="bookYear" placeholder="Chiqgan yili">
                <input type="text" id="bookImg" placeholder="Rasm URL (ixtiyoriy)">
                <input type="text" id="bookPdf" placeholder="PDF havola (ixtiyoriy)">
                <button class="btn" onclick="addBookToBolim(${fanIdx}, ${bolimIdx})"><i class="fas fa-save"></i> Qo'shish</button>
                <button class="btn" onclick="this.closest('.modal').remove()">Bekor qilish</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.style.display = 'flex';
    }
    
    window.addBookToBolim = function(fanIdx, bolimIdx) {
        let name = document.getElementById('bookName').value;
        let author = document.getElementById('bookAuthor').value;
        let year = document.getElementById('bookYear').value;
        let img = document.getElementById('bookImg').value;
        let pdf = document.getElementById('bookPdf').value;
        if (!name) { showToast("❌ Kitob nomini kiriting!"); return; }
        let key = fanIdx + "_" + bolimIdx;
        let books = bolimBooks[key] || [];
        if (books.length >= 50) { showToast("❌ Maksimal 50 ta kitob!"); return; }
        let newBook = {
            id: Date.now(),
            name: name,
            author: author,
            year: year,
            img: img || "https://picsum.photos/100/120?random=" + Date.now(),
            pdf: pdf
        };
        books.push(newBook);
        bolimBooks[key] = books;
        saveBolimBooks();
        showToast("✅ Kitob qo'shildi! (" + books.length + "/50)");
        document.querySelector('.modal')?.remove();
        renderHome();
    };
    
    window.deleteBook = function(fanIdx, bolimIdx, bookId) {
        if (confirm("Kitobni o'chirishni xohlaysizmi?")) {
            let key = fanIdx + "_" + bolimIdx;
            let books = bolimBooks[key] || [];
            books = books.filter(b => b.id !== bookId);
            bolimBooks[key] = books;
            saveBolimBooks();
            showToast("✅ Kitob o'chirildi!");
            renderHome();
        }
    };
    
    window.editBook = function(fanIdx, bolimIdx, bookId) {
        let key = fanIdx + "_" + bolimIdx;
        let books = bolimBooks[key] || [];
        let book = books.find(b => b.id === bookId);
        if (!book) return;
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2><i class="fas fa-edit"></i> Kitobni tahrirlash</h2>
                <input type="text" id="editBookName" value="${book.name}" placeholder="Kitob nomi">
                <input type="text" id="editBookAuthor" value="${book.author || ''}" placeholder="Muallif">
                <input type="text" id="editBookYear" value="${book.year || ''}" placeholder="Chiqgan yili">
                <input type="text" id="editBookImg" value="${book.img || ''}" placeholder="Rasm URL">
                <input type="text" id="editBookPdf" value="${book.pdf || ''}" placeholder="PDF havola">
                <button class="btn" onclick="saveEditedBook(${fanIdx}, ${bolimIdx}, ${bookId})"><i class="fas fa-save"></i> Saqlash</button>
                <button class="btn" onclick="this.closest('.modal').remove()">Bekor</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.style.display = 'flex';
    };
    
    window.saveEditedBook = function(fanIdx, bolimIdx, bookId) {
        let key = fanIdx + "_" + bolimIdx;
        let books = bolimBooks[key] || [];
        let bookIndex = books.findIndex(b => b.id === bookId);
        if (bookIndex === -1) return;
        books[bookIndex] = {
            id: bookId,
            name: document.getElementById('editBookName').value,
            author: document.getElementById('editBookAuthor').value,
            year: document.getElementById('editBookYear').value,
            img: document.getElementById('editBookImg').value || "https://picsum.photos/100/120",
            pdf: document.getElementById('editBookPdf').value
        };
        bolimBooks[key] = books;
        saveBolimBooks();
        showToast("✅ Kitob yangilandi!");
        document.querySelector('.modal')?.remove();
        renderHome();
    };
    
    function editFanName(fanIdx) {
        if (currentUser.role !== 'superadmin') return;
        let newName = prompt("Yangi fan nomi:", getFans()[fanIdx].nom);
        if (newName) {
            fanNames[fanIdx] = newName;
            saveFanNames();
            renderHome();
            showToast("✅ Fan nomi o'zgartirildi!");
        }
    }
    
    function editBolimName(fanIdx, bolimIdx) {
        if (currentUser.role !== 'superadmin') return;
        let fans = getFans();
        let currentName = fans[fanIdx].bolimlar[bolimIdx];
        let newName = prompt("Yangi bo'lim nomi:", currentName);
        if (newName) {
            bolimNames[fanIdx + "_" + bolimIdx] = newName;
            saveBolimNames();
            renderHome();
            showToast("✅ Bo'lim nomi o'zgartirildi!");
        }
    }
    
    function renderHome() {
        let fans = getFans();
        let html = `<div class="card"><h2 style="margin-bottom:20px;"><i class="fas fa-atom"></i> Fanlar dunyosi</h2><div class="fan-grid" id="fanGrid"></div></div>`;
        document.getElementById('pageContent').innerHTML = html;
        let grid = document.getElementById('fanGrid');
        for (let i = 0; i < fans.length; i++) {
            let fan = fans[i];
            let fanDiv = document.createElement('div');
            fanDiv.className = 'fan-card';
            fanDiv.innerHTML = `
                <div class="fan-name">
                    ${fan.nom}
                    ${currentUser?.role === 'superadmin' ? `<span class="fan-edit" onclick="event.stopPropagation(); editFanName(${i})"><i class="fas fa-pen"></i> O'zgartirish</span>` : ''}
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="submenu" id="sub-${i}"></div>
            `;
            fanDiv.onclick = (function(idx) {
                return function(e) {
                    e.stopPropagation();
                    document.getElementById('sub-' + idx).classList.toggle('open');
                };
            })(i);
            let subDiv = fanDiv.querySelector('.submenu');
            for (let j = 0; j < 7; j++) {
                let bolim = fan.bolimlar[j];
                let key = i + "_" + j;
                let books = bolimBooks[key] || [];
                let isAdmin = currentUser?.role === 'superadmin' || currentUser?.role === 'admin';
                
                let booksHtml = '';
                if (books.length > 0) {
                    booksHtml = `<div class="books-list"><h4 style="margin-bottom:10px;"><i class="fas fa-book"></i> Kitoblar (${books.length}/50):</h4>`;
                    for (let bk of books) {
                        booksHtml += `
                            <div class="book-card">
                                <img src="${bk.img || 'https://picsum.photos/60/80'}" onerror="this.src='https://picsum.photos/60/80'">
                                <div class="book-info">
                                    <h4>${bk.name}</h4>
                                    <p>${bk.author || ''} ${bk.year ? '(' + bk.year + ')' : ''}</p>
                                    ${bk.pdf ? `<a href="${bk.pdf}" target="_blank" style="color:#ffd700; font-size:11px;"><i class="fas fa-file-pdf"></i> PDF o'qish</a>` : ''}
                                </div>
                                ${isAdmin ? `
                                <div class="book-actions">
                                    <button class="btn btn-sm" onclick="event.stopPropagation(); editBook(${i}, ${j}, ${bk.id})"><i class="fas fa-edit"></i></button>
                                    <button class="btn btn-red btn-sm" onclick="event.stopPropagation(); deleteBook(${i}, ${j}, ${bk.id})"><i class="fas fa-trash"></i></button>
                                </div>
                                ` : ''}
                            </div>
                        `;
                    }
                    booksHtml += `</div>`;
                }
                
                let subItem = document.createElement('div');
                subItem.className = 'sub-item';
                subItem.innerHTML = `
                    <div class="sub-item-header">
                        <div class="sub-item-title">
                            <i class="fas fa-folder-open"></i> ${bolim}
                            ${currentUser?.role === 'superadmin' ? `<span class="edit-bolim" onclick="event.stopPropagation(); editBolimName(${i}, ${j})"><i class="fas fa-pen"></i> O'zgartirish</span>` : ''}
                        </div>
                        ${isAdmin ? `<button class="btn btn-sm" onclick="event.stopPropagation(); showAddBookModal(${i}, ${j}, '${fan.nom}', '${bolim}')"><i class="fas fa-plus"></i> Kitob qo'shish</button>` : ''}
                    </div>
                    <div style="font-size:13px; margin-top:5px; color:#aaa;">Ma'lumot uchun bosing</div>
                    ${booksHtml}
                `;
                subItem.onclick = (function(fi, bj, fn, bn) {
                    return function(e) {
                        e.stopPropagation();
                        showBolimInfoModal(fn, bn);
                    };
                })(i, j, fan.nom, bolim);
                subDiv.appendChild(subItem);
            }
            grid.appendChild(fanDiv);
        }
    }
    
    function showBolimInfoModal(fanNom, bolimNom) {
        let modal = document.createElement('div');

    window.transfer = function(login) {
        let amount = parseInt(document.getElementById(`amt-${login}`).value);
        if (!amount || amount <= 0) { showToast("❌ Miqdor kiriting!"); return; }
        let time = timeSpent[login] || { balance: 0 };

        timeSpent[login] = time;
        localStorage.setItem('fan_time', JSON.stringify(timeSpent));
        document.getElementById(`bal-${login}`).innerHTML = time.balance + " so'm";
        showToast(`✅ ${login} ga ${amount} so'm o'tkazildi!`);

        if (teacher) {
            teacher.status = 'approved';
            users.push(teacher);
            pendingTeachers = pendingTeachers.filter(t => t.login !== login);
            localStorage.setItem('fan_users', JSON.stringify(users));
            localStorage.setItem('pending_teachers', JSON.stringify(pendingTeachers));
            showToast("✅ O'qituvchi tasdiqlandi!");
            renderAdminPanel();
        }
    };
    
    window.rejectTeacher = function(login) {
        pendingTeachers = pendingTeachers.filter(t => t.login !== login);
        localStorage.setItem('pending_teachers', JSON.stringify(pendingTeachers));
        showToast("❌ Bekor qilindi!");
        renderAdminPanel();
    };
    
    window.deleteAd = function(user) {
        adRequests = adRequests.filter(r => r.user !== user);
        localStorage.setItem('ad_requests', JSON.stringify(adRequests));
        renderAdminPanel();
    };
    
    window.deleteBookReq = function(user) {
        bookSellRequests = bookSellRequests.filter(r => r.user !== user);
        localStorage.setItem('book_sell_requests', JSON.stringify(bookSellRequests));
        renderAdminPanel();
    };
    
    window.addNewAdmin = function() {
        let login = prompt("Admin login:");
        let pass = prompt("Admin parol:");
        let name = prompt("Admin ismi:");
        if (login && pass && name) {
            admins.push({ login, password: pass, name, status: 'active' });
            localStorage.setItem('fan_admins', JSON.stringify(admins));
            showToast("✅ Admin qo'shildi!");
            renderAdminPanel();
        }
    };
    
    window.toggleAdmin = function(login) {
        let admin = admins.find(a => a.login === login);
        if (admin) admin.status = admin.status === 'active' ? 'inactive' : 'active';
        localStorage.setItem('fan_admins', JSON.stringify(admins));
        renderAdminPanel();
    };
    
    window.deleteAdmin = function(login) {
        admins = admins.filter(a => a.login !== login);
        localStorage.setItem('fan_admins', JSON.stringify(admins));
        renderAdminPanel();
    };
    
    window.clearAll = function() {
        if (confirm("HAMMA MA'LUMOTLAR O'CHIRILADI! Davom etasizmi?")) {
            localStorage.clear();
            location.reload();
        }
    };
    
    function showProfile() {
        let user = users.find(u => u.login === currentUser.login) || { name: '', surname: '', middlename: '', email: '', birthdate: '' };
        let img = userImages[currentUser.login] || '';
        let html = `<div class="card"><h2><i class="fas fa-user-circle"></i> Mening profilim</h2>
        <div style="text-align:center;"><img src="${img || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png'}" style="width:120px; height:120px; border-radius:50%;"><br><input type="file" id="profileImg" accept="image/*"><button class="btn" onclick="uploadProfile()"><i class="fas fa-upload"></i> Yuklash</button></div>
        <div class="row-2"><input type="text" id="editName" value="${user.name || ''}" placeholder="Ism"><input type="text" id="editSurname" value="${user.surname || ''}" placeholder="Familiya"></div>
        <input type="text" id="editMiddlename" value="${user.middlename || ''}" placeholder="Sharfi">
        <input type="date" id="editBirthdate" value="${user.birthdate || ''}">
        <input type="email" id="editEmail" value="${user.email || ''}" placeholder="Email">
        <input type="password" id="editPassword" placeholder="Yangi parol">
        <button class="btn" onclick="updateProfile()"><i class="fas fa-save"></i> Saqlash</button>
        </div>`;
        document.getElementById('pageContent').innerHTML = html;
    }
    
    window.uploadProfile = function() {
        let file = document.getElementById('profileImg').files[0];
        if (file && file.size <= 2 * 1024 * 1024) {
            let reader = new FileReader();
            reader.onload = e => { userImages[currentUser.login] = e.target.result; localStorage.setItem('user_images', JSON.stringify(userImages)); showToast("✅ Rasm yangilandi!"); showProfile(); };
            reader.readAsDataURL(file);
        } else showToast("❌ 2MB dan kichik rasm tanlang!");
    };
    
    window.updateProfile = function() {
        let user = users.find(u => u.login === currentUser.login);
        if (user) {
            user.name = document.getElementById('editName').value;
            user.surname = document.getElementById('editSurname').value;
            user.middlename = document.getElementById('editMiddlename').value;
            user.birthdate = document.getElementById('editBirthdate').value;
            user.email = document.getElementById('editEmail').value;
            let newPass = document.getElementById('editPassword').value;
            if (newPass) user.password = newPass;
            localStorage.setItem('fan_users', JSON.stringify(users));
            showToast("✅ Profil yangilandi!");
            showProfile();
        }
    };
    
    function showPage(page) {
        if (page === 'home') renderHome();
        else if (page === 'news') renderNews();
        else if (page === 'quiz') renderQuiz();
        else if (page === 'olympiad') renderOlympiad();
        else if (page === 'stats') renderStats();
        else if (page === 'partners') renderPartners();
        else if (page === 'monetization') renderMonetization();
        else if (page === 'admin') renderAdminPanel();
        else if (page === 'profile') showProfile();
    }
    
    function showMainApp() {
        let roleText = currentUser.role === 'superadmin' ? '👑 Super Admin' : (currentUser.role === 'admin' ? '⚙️ Admin' : '👤 Foydalanuvchi');
        let img = userImages[currentUser.login] || '';
        let adminLink = (currentUser.role === 'superadmin' || currentUser.role === 'admin') ? '<a onclick="showPage(\'admin\')"><i class="fas fa-cog"></i> Admin</a>' : '';
        let monetLink = (currentUser.role === 'superadmin' || currentUser.role === 'admin') ? '<a onclick="showPage(\'monetization\')"><i class="fas fa-coins"></i> Monetizatsiya</a>' : '';
        
        let html = `
            <div class="navbar">
                <div class="logo"><i class="fas fa-graduation-cap"></i> Fan.uz</div>
                <div class="nav-links">
                    <a onclick="showPage('home')"><i class="fas fa-home"></i> Bosh</a>
                    <a onclick="showPage('news')"><i class="fas fa-newspaper"></i> Yangiliklar</a>
                    <a onclick="showPage('quiz')"><i class="fas fa-puzzle-piece"></i> Viktorinalar</a>
                    <a onclick="showPage('olympiad')"><i class="fas fa-trophy"></i> Olimpiadalar</a>
                    <a onclick="showPage('stats')"><i class="fas fa-chart-line"></i> Statistika</a>
                    <a onclick="showPage('partners')"><i class="fas fa-handshake"></i> Hamkorlik</a>
                    <a onclick="showPage('profile')"><i class="fas fa-user"></i> Profil</a>
                    ${adminLink}
                    ${monetLink}
                    <a onclick="logout()"><i class="fas fa-sign-out-alt"></i> Chiqish</a>
                    <div class="lang-selector"><button class="lang-btn active" onclick="setLang('uz')">UZ</button><button class="lang-btn" onclick="setLang('ru')">RU</button><button class="lang-btn" onclick="setLang('en')">EN</button></div>
                    <button onclick="toggleDarkMode()" class="nav-btn"><i class="fas fa-moon"></i></button>
                </div>
                <div class="user-badge"><img src="${img || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png'}"> ${roleText}: ${currentUser.login}</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div style="text-align:center; margin-bottom:20px;" id="timeDisplay"><i class="fas fa-hourglass-half"></i> Bugun: 0 / 180 daqiqa</div>
            <div id="pageContent"></div>
        `;
        document.getElementById('app').innerHTML = html;
        startTimer();
        renderHome();
    }
    
    // ==================== AUTH ====================
    function showAuth() {
        document.getElementById('app').innerHTML = `
            <div class="auth-card">
                <h1><i class="fas fa-graduation-cap"></i> Fan.uz</h1>
                <div class="auth-tabs"><button id="tabLogin" class="active" onclick="toggleAuth('login')">Kirish</button><button id="tabReg" onclick="toggleAuth('register')">Ro'yxatdan o'tish</button></div>
                <div id="authForm"></div>
                <div class="lang-selector" style="justify-content:center; margin-top:20px;"><button class="lang-btn active" onclick="setLang('uz')">UZ</button><button class="lang-btn" onclick="setLang('ru')">RU</button><button class="lang-btn" onclick="setLang('en')">EN</button></div>
                <button onclick="toggleDarkMode()" style="margin-top:15px; background:none; border:1px solid #ffd700; padding:8px 20px; border-radius:30px;"><i class="fas fa-moon"></i></button>
            </div>
        `;
        toggleAuth('login');
    }
    
    window.toggleAuth = function(type) {
        let container = document.getElementById('authForm');
        document.getElementById('tabLogin').classList.toggle('active', type === 'login');
        document.getElementById('tabReg').classList.toggle('active', type === 'register');
        if (type === 'login') {
            container.innerHTML = `<input type="text" id="loginName" placeholder="Login"><input type="password" id="loginPass" placeholder="Parol"><button class="btn" onclick="doLogin()">Kirish</button><div id="authError" class="error"></div>`;
        } else {
            container.innerHTML = `<div class="row-2"><input type="text" id="regName" placeholder="Ism"><input type="text" id="regSurname" placeholder="Familiya"></div>
            <input type="text" id="regMiddlename" placeholder="Sharfi"><div class="row-2"><input type="date" id="regBirthdate"><select id="regGender"><option>Erkak</option><option>Ayol</option></select></div>
            <input type="text" id="regPassport" placeholder="Pasport"><input type="email" id="regEmail" placeholder="Email">
            <input type="text" id="regLogin" placeholder="Login"><input type="password" id="regPass" placeholder="Parol">
            <select id="regType"><option value="student">O'quvchi</option><option value="teacher">O'qituvchi</option></select>
            <input type="text" id="refPromo" placeholder="Taklif kodi"><button class="btn" onclick="doRegister()">Ro'yxatdan o'tish</button><div id="authError" class="error"></div>`;
        }
    };
    
    window.doLogin = function() {
        let login = document.getElementById('loginName').value;
        let pass = document.getElementById('loginPass').value;
        let err = document.getElementById('authError');
        if (login === SUPER_LOGIN && pass === SUPER_PASS) { currentUser = { login: SUPER_LOGIN, role: 'superadmin' }; showMainApp(); return; }
        let admin = admins.find(a => a.login === login && a.password === pass && a.status === 'active');
        if (admin) { currentUser = { login: admin.login, role: 'admin' }; showMainApp(); return; }
        let user = users.find(u => u.login === login && u.password === pass && u.status === 'approved');
        if (user) { currentUser = { login: user.login, role: 'user', promoCode: user.promoCode }; showMainApp(); return; }
        err.innerHTML = "❌ Login yoki parol xato!";
    };
    
    window.doRegister = function() {
        let login = document.getElementById('regLogin').value;
        let pass = document.getElementById('regPass').value;
        let name = document.getElementById('regName').value;
        let surname = document.getElementById('regSurname').value;
        let middlename = document.getElementById('regMiddlename').value;
        let birthdate = document.getElementById('regBirthdate').value;
        let email = document.getElementById('regEmail').value;
        let type = document.getElementById('regType').value;
        let refPromo = document.getElementById('refPromo').value;
        let err = document.getElementById('authError');
        if (!login || !pass || !name || !surname || !email) { err.innerHTML = "❌ Barcha maydonlarni to'ldiring!"; return; }
        if (users.find(u => u.login === login) || pendingTeachers.find(t => t.login === login)) { err.innerHTML = "❌ Login band!"; return; }
        if (login === SUPER_LOGIN) { err.innerHTML = "❌ Login band!"; return; }
        let promoCode = login + "_" + Math.random().toString(36).substr(2,6).toUpperCase();
        let newUser = { login, password: pass, name, surname, middlename, birthdate, email, type, promoCode, refPromo, status: type === 'teacher' ? 'pending' : 'approved' };
        if (type === 'teacher') {
            pendingTeachers.push(newUser);
            localStorage.setItem('pending_teachers', JSON.stringify(pendingTeachers));
            err.innerHTML = "✅ Admin tasdiqlagandan keyin kirasiz!";
            err.style.color = "#88ff88";
        } else {
            users.push(newUser);
            localStorage.setItem('fan_users', JSON.stringify(users));
            timeSpent[login] = { minutes: 0, balance: 0 };
            localStorage.setItem('fan_time', JSON.stringify(timeSpent));
            err.innerHTML = "✅ Ro'yxatdan o'tdingiz! Endi kiring.";
            err.style.color = "#88ff88";
            if (refPromo) {
                let inviter = users.find(u => u.promoCode === refPromo);
                if (inviter) {
                    let invTime = timeSpent[inviter.login] || { balance: 0 };
                    invTime.balance += 1000;
                    timeSpent[inviter.login] = invTime;
                    localStorage.setItem('fan_time', JSON.stringify(timeSpent));
                    showToast(`🎉 +1000 so'm taklif bonusi!`);
                }
            }
        }
        setTimeout(() => toggleAuth('login'), 2000);
    };
    
    window.logout = function() { currentUser = null; if (timer) clearInterval(timer); showAuth(); };
    window.setLang = function(lang) { showToast(lang.toUpperCase() + " tili tanlandi"); };
    window.toggleDarkMode = function() { document.body.classList.toggle('light'); localStorage.setItem('darkMode', document.body.classList.contains('light')); };
    if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('light');
    showAuth();
</script>
</body>
</html>
